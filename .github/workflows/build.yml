name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check shaders compile
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw "fxc.exe not found" }
          $root = "src/WinampInspiredVisualizer"
          $common = Get-Content "$root/Shaders/Common.hlsli" -Raw
          $main = Get-Content "$root/Shaders/PresetMain.hlsli" -Raw
          $out = Join-Path $env:RUNNER_TEMP "shader.cso"
          $failed = $false

          function Test-Shader($name, $source, $entry, $target) {
            $file = Join-Path $env:RUNNER_TEMP "$name-$entry.hlsl"
            Set-Content -Path $file -Value $source -NoNewline
            & $fxc.FullName /nologo /T $target /E $entry /Fo $out $file | Out-Host
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::$name ($entry) failed to compile"; return $false }
            return $true
          }

          $engine = $common + "`n" + (Get-Content "$root/Shaders/Engine.hlsl" -Raw)
          if (-not (Test-Shader "Engine" $engine "VSMain" "vs_5_0")) { $failed = $true }
          if (-not (Test-Shader "Engine" $engine "PSPresent" "ps_5_0")) { $failed = $true }
          if (-not (Test-Shader "Engine" $engine "PSBlend" "ps_5_0")) { $failed = $true }
          if (-not (Test-Shader "Engine" $engine "PSDownsample" "ps_5_0")) { $failed = $true }
          $particles = Get-Content "$root/Shaders/Particles.hlsli" -Raw
          $particleMain = Get-Content "$root/Shaders/ParticleMain.hlsli" -Raw
          if (-not (Test-Shader "Particles" ($common + "`n" + $particles) "PSSprite" "ps_5_0")) { $failed = $true }
          foreach ($preset in Get-ChildItem "$root/Presets/*.hlsl") {
            # Same assembly as Renderer.CompileLoop does at runtime. Particle visuals (they define
            # Simulate) also get the particle API, a compute shader and a vertex shader.
            $code = Get-Content $preset.FullName -Raw
            $isParticles = $code -match '\bvoid\s+Simulate\s*\('
            $api = if ($isParticles) { $common + "`n" + $particles } else { $common }
            $source = $api + "`n#line 1`n" + $code + "`n"
            if (-not (Test-Shader $preset.BaseName ($source + $main) "PSMain" "ps_5_0")) { $failed = $true }
            if ($isParticles) {
              if (-not (Test-Shader $preset.BaseName ($source + $particleMain) "CSMain" "cs_5_0")) { $failed = $true }
              if (-not (Test-Shader $preset.BaseName ($source + $particleMain) "VSParticle" "vs_5_0")) { $failed = $true }
            }
          }
          if ($failed) { exit 1 }

      - name: Publish app
        run: >
          dotnet publish src/WinampInspiredVisualizer/WinampInspiredVisualizer.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Check the MP3 encoder is next to Lucid.exe
        shell: pwsh
        run: |
          # The converter's MP3 encoder is a separate native DLL (LAME). It must sit beside Lucid.exe,
          # not inside the single-file bundle, for it to load.
          Get-ChildItem publish | Format-Table Name, Length -AutoSize | Out-String -Width 200 | Write-Host
          foreach ($dll in "libmp3lame.64.dll", "libmp3lame.32.dll") {
            if (-not (Test-Path "publish/$dll")) { Write-Host "::error::$dll is missing from the published app"; exit 1 }
          }

      - name: Zip app
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Lucid-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Lucid-win-x64
          path: Lucid-win-x64.zip

      - name: Update "latest" download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Lucid-win-x64.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "Latest build" \
            --notes "Automatic build of the newest version on main. Download the zip, unzip it, and run Lucid.exe."
