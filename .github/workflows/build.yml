name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The audio editor's stem splitter model: Demucs' HTDemucs exported to ONNX and checked against Demucs
  # itself (see tools/StemModel). It's cached until the export changes, tested by the Windows and Mac
  # self-tests, and published once as the release the app downloads it from.
  stem-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: cache
        with:
          path: stem-model
          key: stem-model-${{ hashFiles('tools/StemModel/**') }}

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.11'

      - name: Export the model and check it against Demucs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install -r tools/StemModel/requirements.txt
          mkdir -p stem-model
          python tools/StemModel/export_htdemucs.py stem-model/htdemucs.onnx
          cd stem-model
          sha256sum htdemucs.onnx > htdemucs.onnx.sha256
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: stem-model
          path: stem-model/htdemucs.onnx*

      - name: Publish the model for the app to download
        # Only once per model version, so the file people download never changes under them.
        # Pull requests from forks can't write to the repository, and don't need to.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="stem-model-$(grep -oP 'const string Version = "\K[^"]+' src/Lucent.Core/Editor/Stems/StemModel.cs)"
          if gh release view "$tag" --json assets --jq '.assets[].name' 2> /dev/null | grep -qx htdemucs.onnx; then
            echo "$tag is already published."
            exit 0
          fi
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --prerelease --latest=false --title "Stem splitter model ($tag)" --notes \
              "The audio editor's stem splitter downloads this the first time it's used. It's Demucs' HTDemucs model by Meta AI (MIT licence, see LICENSE-Demucs.txt), exported to ONNX by tools/StemModel."
          fi
          cp tools/StemModel/LICENSE-Demucs.txt stem-model/
          gh release upload "$tag" stem-model/htdemucs.onnx stem-model/htdemucs.onnx.sha256 stem-model/LICENSE-Demucs.txt --clobber

  build:
    needs: stem-model
    runs-on: windows-latest
    # Merging several pull requests close together starts several builds of main at once. Only the
    # newest one should publish the Windows download, so a newer build of main cancels an older Windows
    # build that's still running (pull request builds each keep their own group). The Mac builds queue
    # instead of cancelling (see the mac job), since they take longer than the gap between merges.
    concurrency:
      group: ${{ github.event_name == 'push' && 'publish-latest-windows' || format('build-{0}', github.run_id) }}
      cancel-in-progress: true
    env:
      # Every build gets a higher version than the last, so the installer and in-app updates can
      # tell which is newer. The first two numbers are the release being worked towards: a build
      # chosen to be that release is published as it is (see release.yml), so they go up after it.
      LUCENT_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check shaders compile
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw "fxc.exe not found" }
          $root = "src/WinampInspiredVisualizer"
          $common = Get-Content "$root/Shaders/Common.hlsli" -Raw
          $main = Get-Content "$root/Shaders/PresetMain.hlsli" -Raw
          $out = Join-Path $env:RUNNER_TEMP "shader.cso"
          $failed = $false

          function Test-Shader($name, $source, $entry, $target) {
            $file = Join-Path $env:RUNNER_TEMP "$name-$entry.hlsl"
            Set-Content -Path $file -Value $source -NoNewline
            & $fxc.FullName /nologo /T $target /E $entry /Fo $out $file | Out-Host
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::$name ($entry) failed to compile"; return $false }
            return $true
          }

          $engine = $common + "`n" + (Get-Content "$root/Shaders/Engine.hlsl" -Raw)
          if (-not (Test-Shader "Engine" $engine "VSMain" "vs_5_0")) { $failed = $true }
          if (-not (Test-Shader "Engine" $engine "PSPresent" "ps_5_0")) { $failed = $true }
          if (-not (Test-Shader "Engine" $engine "PSBlend" "ps_5_0")) { $failed = $true }
          if (-not (Test-Shader "Engine" $engine "PSDownsample" "ps_5_0")) { $failed = $true }
          $particles = Get-Content "$root/Shaders/Particles.hlsli" -Raw
          $particleMain = Get-Content "$root/Shaders/ParticleMain.hlsli" -Raw
          if (-not (Test-Shader "Particles" ($common + "`n" + $particles) "PSSprite" "ps_5_0")) { $failed = $true }
          # Recording a video turns frames into the encoder's NV12 pictures with these (it stands alone).
          $video = Get-Content "$root/Shaders/VideoEncode.hlsl" -Raw
          if (-not (Test-Shader "VideoEncode" $video "VSMain" "vs_5_0")) { $failed = $true }
          if (-not (Test-Shader "VideoEncode" $video "PSLuma" "ps_5_0")) { $failed = $true }
          if (-not (Test-Shader "VideoEncode" $video "PSChroma" "ps_5_0")) { $failed = $true }
          foreach ($preset in Get-ChildItem "$root/Presets/*.hlsl") {
            # Same assembly as Renderer.CompileLoop does at runtime. Particle visuals (they define
            # Simulate) also get the particle API, a compute shader and a vertex shader.
            $code = Get-Content $preset.FullName -Raw
            $isParticles = $code -match '\bvoid\s+Simulate\s*\('
            $api = if ($isParticles) { $common + "`n" + $particles } else { $common }
            $source = $api + "`n#line 1`n" + $code + "`n"
            if (-not (Test-Shader $preset.BaseName ($source + $main) "PSMain" "ps_5_0")) { $failed = $true }
            if ($isParticles) {
              if (-not (Test-Shader $preset.BaseName ($source + $particleMain) "CSMain" "cs_5_0")) { $failed = $true }
              if (-not (Test-Shader $preset.BaseName ($source + $particleMain) "VSParticle" "vs_5_0")) { $failed = $true }
            }
          }
          # AVS presets draw on the CPU and are shown by one shader, assembled like a visual's.
          # AvsCheck reads and runs every bundled preset, and fails if one won't load or an effect breaks.
          $avsDisplay = $common + "`n#line 1`n" + (Get-Content "$root/Shaders/AvsDisplay.hlsl" -Raw) + "`n" + $main
          if (-not (Test-Shader "AvsDisplay" $avsDisplay "PSMain" "ps_5_0")) { $failed = $true }
          dotnet run --project tools/AvsCheck -c Release | Out-Host
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::AvsCheck failed"; $failed = $true }
          # MilkDrop presets: the engine's own passes, then the sample presets' shaders as the app
          # translates them. MilkDropCheck also checks the expression language and runs each preset.
          $milkDrop = (Get-Content "$root/Shaders/MilkDrop.hlsli" -Raw) + "`n" + (Get-Content "$root/Shaders/MilkDrop.hlsl" -Raw)
          foreach ($entry in "VSWarp", "VSScreen", "VSDraw") {
            if (-not (Test-Shader "MilkDrop" $milkDrop $entry "vs_5_0")) { $failed = $true }
          }
          foreach ($entry in "PSWarpClassic", "PSCompClassic", "PSDraw", "PSDrawTextured", "PSBlurAcross", "PSBlurDown") {
            if (-not (Test-Shader "MilkDrop" $milkDrop $entry "ps_5_0")) { $failed = $true }
          }
          $milkShaders = Join-Path $env:RUNNER_TEMP "milkdrop"
          dotnet run --project tools/MilkDropCheck -c Release -- --shaders $milkShaders | Out-Host
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::MilkDropCheck failed"; $failed = $true }
          foreach ($shader in Get-ChildItem "$milkShaders/*Preset.hlsl") {
            $entry = $shader.BaseName.Split('.')[-1]
            & $fxc.FullName /nologo /T ps_5_0 /E $entry /Fo $out $shader.FullName | Out-Host
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::$($shader.Name) failed to compile"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Build the plugin helper
        run: |
          # LucentPluginHost.exe runs VST3 effects for the audio editor. The app build below copies it
          # next to Lucent.exe. Configuring downloads the VST3 SDK (MIT).
          cmake -S src/PluginHost -B build/PluginHost -A x64
          cmake --build build/PluginHost --config Release

      - name: Publish app
        run: >
          dotnet publish src/WinampInspiredVisualizer/WinampInspiredVisualizer.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.LUCENT_VERSION }}
          -p:SpotifyClientId=${{ secrets.SPOTIFY_CLIENT_ID }}
          -p:CrashReportDsn=${{ secrets.LUCENT_CRASH_DSN }}
          -o publish

      - name: Check the MP3 encoder, plugin helper, WebView2 loader, ONNX Runtime and libVLC are next to Lucent.exe
        shell: pwsh
        run: |
          # The converter's MP3 encoder is a separate native DLL (LAME), and the plugin helper a separate
          # program, and WebView2's loader (the Bandcamp sign-in page) is native too, as is libVLC (videos), which
          # loads its plugins from its own folder. They must sit beside Lucent.exe, not inside the single-file
          # bundle, to be found.
          Get-ChildItem publish | Format-Table Name, Length -AutoSize | Out-String -Width 200 | Write-Host
          foreach ($dll in "libmp3lame.64.dll", "libmp3lame.32.dll", "LucentPluginHost.exe", "WebView2Loader.dll", "onnxruntime.dll", "DirectML.dll", "libvlc/win-x64/libvlc.dll", "libvlc/win-x64/libvlccore.dll", "libvlc/win-x64/plugins/codec/libavcodec_plugin.dll") {
            if (-not (Test-Path "publish/$dll")) { Write-Host "::error::$dll is missing from the published app"; exit 1 }
          }

      - name: Make test music
        shell: pwsh
        run: |
          # A few seconds of tones as WAV and AIFF, which NAudio reads itself, and as MP3, which goes through
          # Media Foundation, encoded with the LAME that ships beside Lucent.exe.
          Add-Type -TypeDefinition @'
          using System;
          using System.IO;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class TestMusic
          {
              private const int Rate = 44100;
              private const int Frames = Rate * 3;

              [DllImport("libmp3lame.64.dll", CallingConvention = CallingConvention.Cdecl)] private static extern IntPtr lame_init();
              [DllImport("libmp3lame.64.dll", CallingConvention = CallingConvention.Cdecl)] private static extern int lame_set_in_samplerate(IntPtr lame, int rate);
              [DllImport("libmp3lame.64.dll", CallingConvention = CallingConvention.Cdecl)] private static extern int lame_set_num_channels(IntPtr lame, int channels);
              [DllImport("libmp3lame.64.dll", CallingConvention = CallingConvention.Cdecl)] private static extern int lame_init_params(IntPtr lame);
              [DllImport("libmp3lame.64.dll", CallingConvention = CallingConvention.Cdecl)] private static extern int lame_encode_buffer_interleaved(IntPtr lame, short[] pcm, int frames, byte[] mp3, int size);
              [DllImport("libmp3lame.64.dll", CallingConvention = CallingConvention.Cdecl)] private static extern int lame_encode_flush(IntPtr lame, byte[] mp3, int size);
              [DllImport("libmp3lame.64.dll", CallingConvention = CallingConvention.Cdecl)] private static extern int lame_close(IntPtr lame);

              public static void Write()
              {
                  // 220 Hz in stereo, a quarter of a second loud then a quarter quiet.
                  var pcm = new short[Frames * 2];
                  for (var i = 0; i < Frames; i++)
                  {
                      var v = (short)(12000 * Math.Sin(2 * Math.PI * 220 * i / Rate) * ((i / 11025) % 2 == 0 ? 1 : 0.3));
                      pcm[i * 2] = v;
                      pcm[i * 2 + 1] = v;
                  }

                  var data = pcm.Length * 2;
                  using (var wav = new BinaryWriter(File.Create("test.wav")))
                  {
                      wav.Write(Encoding.ASCII.GetBytes("RIFF")); wav.Write(36 + data); wav.Write(Encoding.ASCII.GetBytes("WAVEfmt "));
                      wav.Write(16); wav.Write((short)1); wav.Write((short)2); wav.Write(Rate); wav.Write(Rate * 4); wav.Write((short)4); wav.Write((short)16);
                      wav.Write(Encoding.ASCII.GetBytes("data")); wav.Write(data);
                      foreach (var sample in pcm) { wav.Write(sample); }
                  }

                  // AIFF is big-endian, and gives its sample rate as an 80-bit float (44100 is 400E AC44 0000 0000 0000).
                  using (var aiff = new BinaryWriter(File.Create("test.aiff")))
                  {
                      aiff.Write(Encoding.ASCII.GetBytes("FORM")); BigEndian(aiff, 4 + 26 + 16 + data, 4); aiff.Write(Encoding.ASCII.GetBytes("AIFFCOMM"));
                      BigEndian(aiff, 18, 4); BigEndian(aiff, 2, 2); BigEndian(aiff, Frames, 4); BigEndian(aiff, 16, 2);
                      aiff.Write(new byte[] { 0x40, 0x0E, 0xAC, 0x44, 0, 0, 0, 0, 0, 0 });
                      aiff.Write(Encoding.ASCII.GetBytes("SSND")); BigEndian(aiff, 8 + data, 4); BigEndian(aiff, 0, 4); BigEndian(aiff, 0, 4);
                      foreach (var sample in pcm) { BigEndian(aiff, sample, 2); }
                  }

                  var lame = lame_init();
                  lame_set_in_samplerate(lame, Rate);
                  lame_set_num_channels(lame, 2);
                  if (lame_init_params(lame) < 0) { throw new InvalidOperationException("LAME wouldn't start."); }
                  var mp3 = new byte[pcm.Length * 5 / 4 + 7200];
                  var written = lame_encode_buffer_interleaved(lame, pcm, Frames, mp3, mp3.Length);
                  var end = new byte[7200];
                  var flushed = lame_encode_flush(lame, end, end.Length);
                  lame_close(lame);
                  if (written < 0 || flushed < 0) { throw new InvalidOperationException("LAME couldn't encode the test music."); }
                  using (var file = File.Create("test.mp3"))
                  {
                      file.Write(mp3, 0, written);
                      file.Write(end, 0, flushed);
                  }
              }

              private static void BigEndian(BinaryWriter writer, int value, int bytes)
              {
                  for (var i = bytes - 1; i >= 0; i--) { writer.Write((byte)(value >> (8 * i))); }
              }
          }
          '@
          # The files go in the current folder, and LAME is found through PATH.
          [System.IO.Directory]::SetCurrentDirectory($PWD.Path)
          $env:PATH = "$((Resolve-Path publish).Path);$env:PATH"
          [TestMusic]::Write()
          Get-ChildItem test.* | Format-Table Name, Length -AutoSize | Out-String | Write-Host

      - uses: actions/download-artifact@v4
        with:
          name: stem-model
          path: stem-model

      - name: Self-test (decoding, videos, every visual, and the stem splitter)
        shell: pwsh
        env:
          LUCENT_STEM_MODEL: ${{ github.workspace }}\stem-model\htdemucs.onnx
        run: |
          # Lucent.exe is a windowed program: piping its output makes PowerShell wait for it, shows what it
          # writes and sets $LASTEXITCODE. The runner has no graphics card, so Direct3D draws in software.
          publish/Lucent.exe --self-test --sheet windows-visuals.png --video tools/test-media/sync-test.mp4 --video tools/test-media/sync-test.mov --video tools/test-media/sync-test.mkv --video tools/test-media/sync-test-pcm.mp4 test.wav test.aiff test.mp3 | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-visuals
          path: windows-visuals.png
          if-no-files-found: ignore

      - name: Zip app
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Lucent-win-x64.zip

      # Signing: without a certificate, Lucent and its installer are unsigned, so SmartScreen warns
      # people the first time (More info > Run anyway). To sign with Azure Trusted Signing (Artifact
      # Signing), add these repository secrets and nothing else needs to change:
      #   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET  an app registration given the
      #                                    "Trusted Signing Certificate Profile Signer" role on the account
      #   TRUSTED_SIGNING_ENDPOINT         the account's region endpoint, e.g. https://eus.codesigning.azure.net
      #   TRUSTED_SIGNING_ACCOUNT          the signing account's name
      #   TRUSTED_SIGNING_PROFILE          the certificate profile's name
      - name: Set up signing
        id: signing
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: |
          # No account (pull requests from forks never get secrets either): leave it unsigned.
          if (-not $env:AZURE_CLIENT_ID -or -not $env:TRUSTED_SIGNING_ENDPOINT -or -not $env:TRUSTED_SIGNING_ACCOUNT -or -not $env:TRUSTED_SIGNING_PROFILE) {
            Write-Host "::notice::No Trusted Signing account in the secrets, so Lucent for Windows is unsigned."
            exit 0
          }
          $metadata = Join-Path $env:RUNNER_TEMP "trusted-signing.json"
          @{
            Endpoint = $env:TRUSTED_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:TRUSTED_SIGNING_ACCOUNT
            CertificateProfileName = $env:TRUSTED_SIGNING_PROFILE
          } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8
          "metadata=$metadata" >> $env:GITHUB_OUTPUT

      - name: Build the installer
        shell: pwsh
        env:
          # Read by the signing client to sign in to Azure, when signing is set up.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_METADATA: ${{ steps.signing.outputs.metadata }}
        run: |
          # Velopack makes Lucent-Setup.exe (installs for the current user, no admin needed) and the
          # update package and feed that installed copies check for new builds.
          # The packId stays "Lucid" from before the app was renamed Lucent. It names the install folder
          # and identifies the app to Velopack, so changing it would strand copies already installed.
          # The title and main exe can change: Velopack renames and retargets shortcuts when it updates.
          dotnet tool install vpk --version 1.2.161 --tool-path .vpk
          # With signing set up, Velopack signs Lucent.exe, the other programs and libraries that aren't
          # signed already, the installer and the updater.
          $signing = if ($env:SIGNING_METADATA) { @("--azureTrustedSignFile", $env:SIGNING_METADATA) } else { @() }
          .vpk/vpk pack --packId Lucid --packVersion $env:LUCENT_VERSION --packDir publish --mainExe Lucent.exe `
            --packTitle Lucent --packAuthors joshuadav86 `
            --icon src/WinampInspiredVisualizer/Assets/Lucent.ico `
            --splashImage assets/lucent-icon.png --splashProgressColor "#8B5CF6" `
            --outputDir releases @signing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item releases/Lucid-win-Setup.exe Lucent-Setup.exe
          Get-ChildItem releases | Format-Table Name, Length -AutoSize | Out-String -Width 200 | Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: Lucent-win-x64
          path: Lucent-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Lucent-Setup
          path: Lucent-Setup.exe

      - name: Update "latest" download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A build that finishes after a newer commit reached main mustn't replace that one's download.
          newest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$newest" != "$GITHUB_SHA" ]; then
            echo "main has moved on to $newest; leaving the latest download to that build."
            exit 0
          fi
          # Recreating the release would drop the Mac downloads, which come from a slower job that may
          # still be running; keep the newest ones until that job replaces them.
          mkdir -p mac-carry
          gh release download latest -p '*mac*' -p '*osx*' -D mac-carry 2> /dev/null || true
          cat > release-notes.md << 'NOTES'
          Automatic build of the newest version on main.

          Windows: download Lucent-Setup.exe and run it to install Lucent; it keeps itself up to date from here. Or download Lucent-win-x64.zip, unzip it, and run Lucent.exe without installing (that copy doesn't update itself).

          Mac (macOS 12 or later): download Lucent-Setup-mac-arm64.pkg for Apple silicon Macs (M1 and later) or Lucent-Setup-mac-x64.pkg for Intel Macs, and open it to install Lucent into Applications; it keeps itself up to date from here. Or download Lucent-mac-arm64.zip or Lucent-mac-x64.zip and open Lucent.app from it (that copy doesn't update itself). If macOS says it can't check the app or installer, open System Settings > Privacy & Security and click Open Anyway.
          NOTES
          gh release delete latest --cleanup-tag --yes || true
          # The .nupkg and the releases/assets files are what installed copies of Lucent update from.
          gh release create latest Lucent-Setup.exe Lucent-win-x64.zip \
            releases/*.nupkg releases/releases.win.json releases/assets.win.json releases/RELEASES \
            --target "$GITHUB_SHA" --prerelease \
            --title "Latest build ($LUCENT_VERSION)" \
            --notes-file release-notes.md
          if [ -n "$(ls -A mac-carry)" ]; then gh release upload latest mac-carry/* --clobber; fi

  # The Windows and Mac apps are kept the same: every file, setting, and piece of Lucent.Core one uses, the
  # other does too, unless docs/PARITY.md says why not (see tools/ParityCheck).
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check Windows and Mac have the same features
        run: dotnet run --project tools/ParityCheck -c Release

      - name: Check the Mac styles have no selector through two templates
        # Avalonia only rejects "/template/ … /template/" when the style first loads, which can be long
        # after launch (it crashed 1.0.480 as the Library opened), so it's caught here instead.
        run: |
          if grep -rnE 'Selector="[^"]*/template/[^"]*/template/' --include='*.axaml' src/Lucent.Mac; then
            echo "::error::A style selector goes through two templates. Avalonia throws as it loads; reach the inner part another way (a TemplateBinding, say)."
            exit 1
          fi

  # The Mac app draws the same visuals with Metal. Their HLSL is translated to Metal Shading Language
  # here, on Linux, because Microsoft's DXC compiler (the first half of the translation) has no Mac release.
  metal-shaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Get the DXC shader compiler
        run: |
          curl -sSL -o dxc.tar.gz https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.8.2407/linux_dxc_2024_07_31.x86_64.tar.gz
          mkdir -p "$RUNNER_TEMP/dxc"
          tar -xzf dxc.tar.gz -C "$RUNNER_TEMP/dxc"
          echo "DXC=$RUNNER_TEMP/dxc/bin/dxc" >> "$GITHUB_ENV"

      - name: Translate the visuals to Metal
        run: dotnet run --project tools/MetalShaders -c Release -- src/WinampInspiredVisualizer artifacts/metal-shaders

      - uses: actions/upload-artifact@v4
        with:
          name: metal-shaders
          path: artifacts/metal-shaders

  # DXC has no Mac release either, but the Mac app needs it as it runs too: it translates the user's own
  # visuals (and built-in ones they've edited) to Metal. So its library is built here as one universal
  # file for both kinds of Mac, once per DXC version (the result is cached), and ships inside Lucent.app.
  dxc-mac:
    # On an Intel Mac: GitHub's Apple silicon Macs are often all busy, and a job waiting for one is
    # cancelled after about 15 minutes, which held up both Mac builds. This only restores (or, once,
    # builds) a universal library, so either kind of Mac will do, and the Intel ones have been free.
    runs-on: macos-15-intel
    env:
      DXC_VERSION: v1.8.2407
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: dxc-mac
          key: dxc-mac-universal-${{ env.DXC_VERSION }}-1

      # DXC 1.8 and the VST3 SDK still set CMake policies that CMake 4 (on the Mac runners) no longer allows.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.x'

      - name: Build DXC's library for macOS
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          command -v ninja > /dev/null || brew install ninja
          git clone --depth 1 --branch "$DXC_VERSION" --recurse-submodules --shallow-submodules \
            https://github.com/microsoft/DirectXShaderCompiler.git dxc-src
          # DXC 1.8's LLVM specializes std traits, which the newest Xcode's libc++ rejects by default.
          cmake -S dxc-src -B dxc-build -G Ninja -C dxc-src/cmake/caches/PredefinedParams.cmake \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_CXX_FLAGS='-Wno-invalid-specialization' -DHLSL_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_TESTS=OFF -DCLANG_INCLUDE_TESTS=OFF -DSPIRV_BUILD_TESTS=OFF
          ninja -C dxc-build dxcompiler
          mkdir -p dxc-mac
          cp -L dxc-build/lib/libdxcompiler.dylib dxc-mac/
          cp dxc-src/LICENSE.TXT dxc-mac/LICENSE-DXC.txt
          cp dxc-src/ThirdPartyNotices.txt dxc-mac/LICENSE-ThirdPartyNotices.txt 2> /dev/null || true

      - name: Check the library
        run: |
          file dxc-mac/libdxcompiler.dylib
          # It must stand alone: nothing but the system's own libraries.
          otool -L dxc-mac/libdxcompiler.dylib
          if otool -L dxc-mac/libdxcompiler.dylib | tail -n +2 | grep -v -e /usr/lib/ -e /System/ -e libdxcompiler; then
            echo "::error::libdxcompiler.dylib needs libraries that won't be in Lucent.app."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dxc-mac
          path: dxc-mac

  # The Mac app, for Apple silicon (arm64) and Intel (x64) Macs, both built on an Intel runner: GitHub's
  # Apple silicon runners are often too scarce to get one at all, and the download mustn't wait on them.
  # The Intel build is tested here; the Apple silicon one is tested by mac-arm64-check below. Each is packaged twice: Lucent.app zipped as it is (runs from anywhere, doesn't update itself),
  # and with Velopack, which makes an installer (.pkg) and the update feed installed copies check, in its
  # own channel (osx-arm64, osx-x64) so each Mac only ever updates to the build for its chip.
  #
  # Signing: without a Developer ID, everything is signed ad hoc, so the first time macOS asks people
  # to allow Lucent in System Settings > Privacy & Security. To sign and notarize, add these repository
  # secrets and nothing else needs to change:
  #   MACOS_CERTIFICATE_P12            the "Developer ID Application" certificate and key, exported as .p12, base64
  #   MACOS_CERTIFICATE_PASSWORD       that .p12's password
  #   MACOS_SIGN_APP_IDENTITY          its name, e.g. "Developer ID Application: Your Name (TEAMID)"
  #   MACOS_INSTALLER_CERTIFICATE_P12  (optional) the "Developer ID Installer" certificate as .p12, base64, to sign the .pkg
  #   MACOS_INSTALLER_CERTIFICATE_PASSWORD  (optional) that .p12's password
  #   MACOS_SIGN_INSTALL_IDENTITY      (optional) its name, e.g. "Developer ID Installer: Your Name (TEAMID)"
  #   APPLE_ID                         (optional, for notarizing) the Apple ID of the developer account
  #   APPLE_TEAM_ID                    (optional, for notarizing) the team ID
  #   APPLE_APP_PASSWORD               (optional, for notarizing) an app-specific password for that Apple ID
  mac:
    needs: [metal-shaders, dxc-mac, stem-model]
    strategy:
      fail-fast: false
      matrix:
        include:
          # cpu is the runner's chip. The arm64 build is cross-compiled (LAME, the plugin helper and
          # DXC are universal already), so it can't run here and skips the steps that run Lucent.
          - arch: arm64
            runner: macos-15-intel
            cpu: x86_64
          - arch: x64
            runner: macos-15-intel
            cpu: x86_64
    runs-on: ${{ matrix.runner }}
    # Builds of main queue up per chip rather than cancelling each other: a Mac build takes longer than the gap between merges, so cancelling would mean none ever finished
    # and published. GitHub keeps only the newest waiting build, so the queue never grows past one.
    concurrency:
      group: ${{ github.event_name == 'push' && format('publish-latest-mac-{0}', matrix.arch) || format('mac-{0}-{1}', github.run_id, matrix.arch) }}
      cancel-in-progress: false
    env:
      LUCENT_VERSION: 1.0.${{ github.run_number }}
      RID: osx-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v4
        with:
          name: metal-shaders
          path: artifacts/metal-shaders

      - uses: actions/download-artifact@v4
        with:
          name: dxc-mac
          path: artifacts/dxc-mac

      - name: Check the Metal shaders compile
        run: |
          # Xcode's offline Metal compiler, when this runner has it; the self-test below compiles
          # them on the graphics card as well.
          if ! xcrun -sdk macosx metal -v > /dev/null 2>&1; then
            echo "::notice::No offline Metal compiler on this runner; the self-test compiles the shaders instead."
            exit 0
          fi
          failed=0
          while IFS= read -r -d '' file; do
            if ! xcrun -sdk macosx metal -std=macos-metal2.1 -c "$file" -o "$RUNNER_TEMP/shader.air" 2> "$RUNNER_TEMP/metal.log"; then
              echo "::error::$file didn't compile"
              cat "$RUNNER_TEMP/metal.log"
              failed=1
            fi
          done < <(find artifacts/metal-shaders -name '*.metal' -print0)
          exit $failed

      # The editor's native pieces, built before publishing so the publish copies them next to the Lucent
      # executable: libmp3lame (MP3 saving) and the VST3 plugin helper (src/PluginHost). Both are universal.
      # DXC 1.8 and the VST3 SDK still set CMake policies that CMake 4 (on the Mac runners) no longer allows.
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.x'

      - name: Build LAME for MP3 saving
        run: tools/build-lame-mac.sh

      - name: Build the VST3 plugin helper
        run: tools/build-pluginhost-mac.sh


      - name: Publish the Mac app
        run: >
          dotnet publish src/Lucent.Mac/Lucent.Mac.csproj
          -c Release -r ${{ env.RID }} --self-contained true
          -p:Version=${{ env.LUCENT_VERSION }}
          -p:SpotifyClientId=${{ secrets.SPOTIFY_CLIENT_ID }}
          -p:CrashReportDsn=${{ secrets.LUCENT_CRASH_DSN }}
          -o publish-mac

      - name: Make test music
        if: matrix.arch == 'x64'
        run: tools/mac/make-test-music.sh

      - uses: actions/download-artifact@v4
        if: matrix.arch == 'x64'
        with:
          name: stem-model
          path: stem-model

      - name: Self-test (decoding, videos, every visual, recording a video, and the stem splitter)
        if: matrix.arch == 'x64'
        # A hang fails the build instead of holding the runner for GitHub's six-hour limit.
        timeout-minutes: 40
        env:
          LUCENT_STEM_MODEL: ${{ github.workspace }}/stem-model/htdemucs.onnx
        run: |
          # libVLC (videos) ships in its own folder for this chip, with its plugins.
          test -f "publish-mac/libvlc/$RID/lib/libvlc.dylib" && test -f "publish-mac/libvlc/$RID/lib/vlc/plugins/libavcodec_plugin.dylib" \
            || { echo "::error::libVLC is missing from the published app"; exit 1; }
          publish-mac/Lucent --self-test --sheet mac-visuals-${{ matrix.arch }}.png \
            --video tools/test-media/sync-test.mp4 --video tools/test-media/sync-test.mov --video tools/test-media/sync-test.mkv --video tools/test-media/sync-test-pcm.mp4 \
            test.wav test.m4a test-alac.m4a test.flac test.aiff

      - name: Set up signing
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_APP_IDENTITY: ${{ secrets.MACOS_SIGN_APP_IDENTITY }}
          MACOS_INSTALLER_CERTIFICATE_P12: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_INSTALL_IDENTITY: ${{ secrets.MACOS_SIGN_INSTALL_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # No certificate (pull requests from forks never get secrets either): sign ad hoc.
          if [ -z "$MACOS_CERTIFICATE_P12" ] || [ -z "$MACOS_SIGN_APP_IDENTITY" ]; then
            echo "::notice::No Developer ID certificate in the secrets, so Lucent is signed ad hoc and not notarized."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A keychain just for this job, holding the certificates, and the notary credentials.
          keychain="$RUNNER_TEMP/lucent-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/app.p12"
          if [ -n "$MACOS_INSTALLER_CERTIFICATE_P12" ] && [ -n "$MACOS_SIGN_INSTALL_IDENTITY" ]; then
            echo "$MACOS_INSTALLER_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -k "$keychain" -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" \
              -T /usr/bin/productbuild -T /usr/bin/productsign
            rm -f "$RUNNER_TEMP/installer.p12"
            echo "install_identity=$MACOS_SIGN_INSTALL_IDENTITY" >> "$GITHUB_OUTPUT"
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "identity=$MACOS_SIGN_APP_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            xcrun notarytool store-credentials lucent-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
            echo "notary_profile=lucent-notary" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No notarization credentials in the secrets, so Lucent is signed but not notarized."
          fi

      - name: Make Lucent.app
        env:
          MAC_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          MAC_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          NOTARY_PROFILE: ${{ steps.signing.outputs.notary_profile }}
        run: |
          tools/package-mac.sh publish-mac out "$LUCENT_VERSION"
          if [ -n "$NOTARY_PROFILE" ]; then
            # Notarize the plain app too, and staple the ticket so it opens without going online.
            ditto -c -k --keepParent out/Lucent.app "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --keychain-profile "$NOTARY_PROFILE" --keychain "$MAC_KEYCHAIN" --wait
            xcrun stapler staple out/Lucent.app
          fi
          ditto -c -k --keepParent out/Lucent.app "Lucent-mac-${{ matrix.arch }}.zip"

      - name: Build the installer and update package
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          SIGN_INSTALL_IDENTITY: ${{ steps.signing.outputs.install_identity }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          NOTARY_PROFILE: ${{ steps.signing.outputs.notary_profile }}
        run: |
          # Velopack adds its updater to Lucent.app, signs it again, and makes Lucent-osx-<arch>-Setup.pkg
          # (installs into Applications), the update package (.nupkg) and the feed installed copies check
          # (releases.osx-<arch>.json). The Mac app is new, so its packId is "Lucent" (Windows keeps "Lucid").
          dotnet tool install vpk --version 1.2.161 --tool-path .vpk
          args=(pack --packId Lucent --packVersion "$LUCENT_VERSION" --packDir out/Lucent.app --mainExe Lucent
            --packTitle Lucent --packAuthors joshuadav86 --channel "$RID" --runtime "$RID"
            --signEntitlements tools/mac/Lucent.entitlements --outputDir releases-mac)
          if [ "$SIGN_IDENTITY" = "-" ]; then
            # Ad hoc: vpk signs as if for notarization, so a stand-in codesign leaves out what ad-hoc
            # signatures can't have (see tools/mac/adhoc-codesign.sh).
            mkdir -p "$RUNNER_TEMP/adhoc-codesign"
            cp tools/mac/adhoc-codesign.sh "$RUNNER_TEMP/adhoc-codesign/codesign"
            chmod +x "$RUNNER_TEMP/adhoc-codesign/codesign"
            export PATH="$RUNNER_TEMP/adhoc-codesign:$PATH"
            args+=(--signAppIdentity adhoc)
          else
            args+=(--signAppIdentity "$SIGN_IDENTITY" --keychain "$KEYCHAIN")
            if [ -n "$SIGN_INSTALL_IDENTITY" ]; then args+=(--signInstallIdentity "$SIGN_INSTALL_IDENTITY"); fi
            if [ -n "$NOTARY_PROFILE" ]; then args+=(--notaryProfile "$NOTARY_PROFILE"); fi
          fi
          .vpk/vpk "${args[@]}"
          ls -l releases-mac

          # Check the installable app is signed, and gather what the release needs.
          mkdir -p check mac-release
          ditto -x -k "releases-mac/Lucent-$RID-Portable.zip" check
          codesign --verify --deep --strict --verbose=2 check/Lucent.app
          test -x check/Lucent.app/Contents/MacOS/UpdateMac
          cp "releases-mac/Lucent-$RID-Setup.pkg" "mac-release/Lucent-Setup-mac-${{ matrix.arch }}.pkg"
          cp "Lucent-mac-${{ matrix.arch }}.zip" mac-release/
          cp releases-mac/*.nupkg "releases-mac/releases.$RID.json" "releases-mac/assets.$RID.json" "releases-mac/RELEASES-$RID" mac-release/

      - name: Check Lucent.app opens and lays out its windows
        if: matrix.arch == 'x64'
        run: tools/mac/launch-check.sh check/Lucent.app

      - uses: actions/upload-artifact@v4
        with:
          name: Lucent-mac-${{ matrix.arch }}
          path: Lucent-mac-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Lucent-Setup-mac-${{ matrix.arch }}
          path: mac-release/Lucent-Setup-mac-${{ matrix.arch }}.pkg

      # Everything the "latest" release gets from this Mac build.
      - uses: actions/upload-artifact@v4
        with:
          name: mac-release-${{ matrix.arch }}
          path: mac-release
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-visuals-${{ matrix.arch }}
          path: mac-visuals-${{ matrix.arch }}.png
          if-no-files-found: ignore

      # Each Mac build adds its own downloads to "latest" as soon as it's done, without waiting for the
      # other chip's. The Windows build makes that release (and carries the Mac files over when it
      # replaces it), so wait for it to exist, and retry if the Windows build is replacing it right then.
      - name: Add this Mac's downloads to "latest"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            if gh release view latest -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 &&
               gh release upload latest mac-release/* -R "$GITHUB_REPOSITORY" --clobber; then
              # Drop this chip's update packages from older builds; the feed only lists this one.
              for old in $(gh release view latest -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -- "-$RID-.*\.nupkg$"); do
                [ -e "mac-release/$old" ] || gh release delete-asset latest "$old" -R "$GITHUB_REPOSITORY" --yes || true
              done
              echo "Added the $RID downloads to the latest release."
              exit 0
            fi
            echo "The latest release isn't there yet (attempt $attempt); trying again in 30 seconds."
            sleep 30
          done
          echo "::error::Couldn't add the Mac downloads to the latest release."
          exit 1

      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}" || true

  # The Apple silicon build from the mac job, tested on an Apple silicon Mac: the self-test, then the
  # launch and window layout checks. Not a required check, and it publishes nothing, so a wait for one of
  # GitHub's scarce Apple silicon runners never holds up a merge or the "latest" download.
  mac-arm64-check:
    needs: [mac, stem-model]
    runs-on: macos-latest
    # As with the mac job, builds of main queue up here, keeping only the newest waiting one.
    concurrency:
      group: ${{ github.event_name == 'push' && 'mac-arm64-check-main' || format('mac-arm64-check-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Lucent-mac-arm64
          path: built

      - uses: actions/download-artifact@v4
        with:
          name: stem-model
          path: stem-model

      - name: Unpack Lucent.app
        run: |
          ditto -x -k built/Lucent-mac-arm64.zip built
          codesign --verify --deep --strict --verbose=2 built/Lucent.app
          file built/Lucent.app/Contents/MacOS/Lucent

      - name: Make test music
        run: tools/mac/make-test-music.sh

      - name: Self-test (decoding, videos, every visual, recording a video, and the stem splitter)
        timeout-minutes: 40
        env:
          LUCENT_STEM_MODEL: ${{ github.workspace }}/stem-model/htdemucs.onnx
        run: |
          # libVLC (videos) ships inside the app for this chip, with its plugins.
          test -f built/Lucent.app/Contents/MacOS/libvlc/osx-arm64/lib/libvlc.dylib \
            && test -f built/Lucent.app/Contents/MacOS/libvlc/osx-arm64/lib/vlc/plugins/libavcodec_plugin.dylib \
            || { echo "::error::libVLC is missing from Lucent.app"; exit 1; }
          built/Lucent.app/Contents/MacOS/Lucent --self-test --sheet mac-visuals-arm64.png \
            --video tools/test-media/sync-test.mp4 --video tools/test-media/sync-test.mov --video tools/test-media/sync-test.mkv --video tools/test-media/sync-test-pcm.mp4 \
            test.wav test.m4a test-alac.m4a test.flac test.aiff

      - name: Check Lucent.app opens and lays out its windows
        run: tools/mac/launch-check.sh built/Lucent.app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-visuals-arm64
          path: mac-visuals-arm64.png
          if-no-files-found: ignore
