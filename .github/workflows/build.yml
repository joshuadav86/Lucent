name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Merging several pull requests close together starts several builds of main at once. Only the
# newest one should publish the "latest" download, so a newer build of main cancels an older one
# that's still running (pull request builds each keep their own group).
concurrency:
  group: ${{ github.event_name == 'push' && 'publish-latest' || format('build-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      # Every build gets a higher version than the last, so the installer and in-app updates can
      # tell which is newer.
      LUCENT_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check shaders compile
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw "fxc.exe not found" }
          $root = "src/WinampInspiredVisualizer"
          $common = Get-Content "$root/Shaders/Common.hlsli" -Raw
          $main = Get-Content "$root/Shaders/PresetMain.hlsli" -Raw
          $out = Join-Path $env:RUNNER_TEMP "shader.cso"
          $failed = $false

          function Test-Shader($name, $source, $entry, $target) {
            $file = Join-Path $env:RUNNER_TEMP "$name-$entry.hlsl"
            Set-Content -Path $file -Value $source -NoNewline
            & $fxc.FullName /nologo /T $target /E $entry /Fo $out $file | Out-Host
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::$name ($entry) failed to compile"; return $false }
            return $true
          }

          $engine = $common + "`n" + (Get-Content "$root/Shaders/Engine.hlsl" -Raw)
          if (-not (Test-Shader "Engine" $engine "VSMain" "vs_5_0")) { $failed = $true }
          if (-not (Test-Shader "Engine" $engine "PSPresent" "ps_5_0")) { $failed = $true }
          if (-not (Test-Shader "Engine" $engine "PSBlend" "ps_5_0")) { $failed = $true }
          if (-not (Test-Shader "Engine" $engine "PSDownsample" "ps_5_0")) { $failed = $true }
          $particles = Get-Content "$root/Shaders/Particles.hlsli" -Raw
          $particleMain = Get-Content "$root/Shaders/ParticleMain.hlsli" -Raw
          if (-not (Test-Shader "Particles" ($common + "`n" + $particles) "PSSprite" "ps_5_0")) { $failed = $true }
          foreach ($preset in Get-ChildItem "$root/Presets/*.hlsl") {
            # Same assembly as Renderer.CompileLoop does at runtime. Particle visuals (they define
            # Simulate) also get the particle API, a compute shader and a vertex shader.
            $code = Get-Content $preset.FullName -Raw
            $isParticles = $code -match '\bvoid\s+Simulate\s*\('
            $api = if ($isParticles) { $common + "`n" + $particles } else { $common }
            $source = $api + "`n#line 1`n" + $code + "`n"
            if (-not (Test-Shader $preset.BaseName ($source + $main) "PSMain" "ps_5_0")) { $failed = $true }
            if ($isParticles) {
              if (-not (Test-Shader $preset.BaseName ($source + $particleMain) "CSMain" "cs_5_0")) { $failed = $true }
              if (-not (Test-Shader $preset.BaseName ($source + $particleMain) "VSParticle" "vs_5_0")) { $failed = $true }
            }
          }
          if ($failed) { exit 1 }

      - name: Publish app
        run: >
          dotnet publish src/WinampInspiredVisualizer/WinampInspiredVisualizer.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.LUCENT_VERSION }}
          -o publish

      - name: Check the MP3 encoder is next to Lucent.exe
        shell: pwsh
        run: |
          # The converter's MP3 encoder is a separate native DLL (LAME). It must sit beside Lucent.exe,
          # not inside the single-file bundle, for it to load.
          Get-ChildItem publish | Format-Table Name, Length -AutoSize | Out-String -Width 200 | Write-Host
          foreach ($dll in "libmp3lame.64.dll", "libmp3lame.32.dll") {
            if (-not (Test-Path "publish/$dll")) { Write-Host "::error::$dll is missing from the published app"; exit 1 }
          }

      - name: Zip app
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Lucent-win-x64.zip

      - name: Build the installer
        shell: pwsh
        run: |
          # Velopack makes Lucent-Setup.exe (installs for the current user, no admin needed) and the
          # update package and feed that installed copies check for new builds.
          # The packId stays "Lucid" from before the app was renamed Lucent. It names the install folder
          # and identifies the app to Velopack, so changing it would strand copies already installed.
          # The title and main exe can change: Velopack renames and retargets shortcuts when it updates.
          dotnet tool install vpk --version 1.2.161 --tool-path .vpk
          .vpk/vpk pack --packId Lucid --packVersion $env:LUCENT_VERSION --packDir publish --mainExe Lucent.exe `
            --packTitle Lucent --packAuthors joshuadav86 `
            --icon src/WinampInspiredVisualizer/Assets/Lucent.ico `
            --splashImage assets/lucent-icon.png --splashProgressColor "#8B5CF6" `
            --outputDir releases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item releases/Lucid-win-Setup.exe Lucent-Setup.exe
          Get-ChildItem releases | Format-Table Name, Length -AutoSize | Out-String -Width 200 | Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: Lucent-win-x64
          path: Lucent-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Lucent-Setup
          path: Lucent-Setup.exe

      - name: Update "latest" download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A build that finishes after a newer commit reached main mustn't replace that one's download.
          newest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$newest" != "$GITHUB_SHA" ]; then
            echo "main has moved on to $newest; leaving the latest download to that build."
            exit 0
          fi
          gh release delete latest --cleanup-tag --yes || true
          # The .nupkg and the releases/assets files are what installed copies of Lucent update from.
          gh release create latest Lucent-Setup.exe Lucent-win-x64.zip \
            releases/*.nupkg releases/releases.win.json releases/assets.win.json releases/RELEASES \
            --target "$GITHUB_SHA" --prerelease \
            --title "Latest build ($LUCENT_VERSION)" \
            --notes "Automatic build of the newest version on main. Download Lucent-Setup.exe and run it to install Lucent; it keeps itself up to date from here. Or download the zip, unzip it, and run Lucent.exe without installing (that copy doesn't update itself)."
