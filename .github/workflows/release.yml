name: Release

# Makes a stable release out of the build on the "Latest build" release, as it is: the same files
# people have been trying, not a fresh build. Installed copies on stable releases (the default) update
# to it; the download buttons can point at it with GitHub's releases/latest/download/<file> links.
#
# Run it from the Actions tab once every build of main has finished. A change only to one platform's app
# doesn't rebuild the other, so the Windows and Mac builds on "Latest build" can be from different
# commits (and versions); each is the newest of its own app, and the release is tagged at the newest.
# Later builds count up from the next version along (1.0 to 1.1, say) by themselves (build.yml reads the
# newest stable release), and the website's download buttons switch to this release (pages.yml).
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Name of the release, e.g. "Lucent 1.0"'
        required: true
      notes:
        description: "What's new, in a sentence or a few (shown above the download instructions)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the latest build to a stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          # Builds still running would replace files on "Latest build" while they're copied.
          running=$(gh run list --workflow build.yml --branch main --event push --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$running" -ne 0 ]; then
            echo "::error::A build of main is still running. Try again once it has finished."
            exit 1
          fi

          mkdir files
          gh release download latest -D files

          missing=0
          for feed in releases.win.json releases.osx-arm64.json releases.osx-x64.json; do
            [ -f "files/$feed" ] || { echo "::error::$feed isn't on the latest build."; missing=1; }
          done
          for file in Lucent-Setup.exe Lucent-win-x64.zip Lucent-Setup-mac-arm64.pkg Lucent-Setup-mac-x64.pkg Lucent-mac-arm64.zip Lucent-mac-x64.zip; do
            [ -f "files/$file" ] || { echo "::error::$file isn't on the latest build."; missing=1; }
          done
          # Both Macs are built together, so their builds must be from the same commit.
          if [ -f files/commit-osx-arm64.txt ] && [ -f files/commit-osx-x64.txt ] && ! cmp -s files/commit-osx-arm64.txt files/commit-osx-x64.txt; then
            echo "::error::The Apple silicon and Intel Mac builds on the latest build are from different commits: one of them failed."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          # The newest of the builds' versions, and the newest commit they're from (each build says which;
          # the release itself names the Windows one). Every build is from main, so the newest commit is
          # the one the others are ancestors of.
          version=$(jq -r '.Assets[].Version' files/releases.*.json | sort -V | tail -n 1)
          commit=$(gh release view latest --json targetCommitish --jq .targetCommitish)
          for file in files/commit-*.txt; do
            [ -f "$file" ] || continue
            candidate=$(tr -d '[:space:]' < "$file")
            if [ "$(gh api "repos/$GH_REPO/compare/$commit...$candidate" --jq .status)" = ahead ]; then
              commit=$candidate
            fi
          done
          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::$version is already released as $tag."
            exit 1
          fi

          {
            if [ -n "$NOTES" ]; then printf '%s\n\n' "$NOTES"; fi
            cat << 'NOTES'
          Windows: download Lucent-Setup.exe and run it to install Lucent; it keeps itself up to date from here. Or download Lucent-win-x64.zip, unzip it, and run Lucent.exe without installing (that copy doesn't update itself).

          Mac (macOS 12 or later): download Lucent-Setup-mac-arm64.pkg for Apple silicon Macs (M1 and later) or Lucent-Setup-mac-x64.pkg for Intel Macs, and open it to install Lucent into Applications; it keeps itself up to date from here. Or download Lucent-mac-arm64.zip or Lucent-mac-x64.zip and open Lucent.app from it (that copy doesn't update itself). If macOS says it can't check the app or installer, open System Settings > Privacy & Security and click Open Anyway.
          NOTES
          } > release-notes.md

          gh release create "$tag" files/* --target "$commit" --title "$TITLE" --notes-file release-notes.md --latest
          echo "Released $version as $tag: $(gh release view "$tag" --json url --jq .url)"

          # Republish the website so its download buttons point at the new release.
          gh workflow run pages.yml --ref main
