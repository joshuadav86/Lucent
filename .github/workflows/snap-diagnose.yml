name: Snap diagnose
on:
  push:
    branches: [snap-diagnose]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get the latest build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download latest -p Lucid-win-x64.zip -R $env:GITHUB_REPOSITORY
          Expand-Archive Lucid-win-x64.zip -DestinationPath app
      - name: Drag windows and record where they go
        shell: powershell
        run: ./tools/snap-diagnose.ps1
      - name: Save the screenshots to the branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p diag && cp "$RUNNER_TEMP"/shots/*.png diag/ || true
          git add diag && git commit -m "Diagnose screenshots [skip ci]" && git push || true
