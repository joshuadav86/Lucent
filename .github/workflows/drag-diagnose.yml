name: EQ bands diagnose
on:
  push:
    branches: [snap-check2, snap-check3]
permissions:
  contents: write
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet publish src/WinampInspiredVisualizer/WinampInspiredVisualizer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Drag the player
        shell: powershell
        run: ./tools/drag-diagnose.ps1
      - name: Save the screenshots to the branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p shots/${{ matrix.os }} && cp "$RUNNER_TEMP"/shots/* shots/${{ matrix.os }}/ || true
          git add shots && git commit -m "Drag screenshots [skip ci]" && (git push || (git pull --no-rebase --no-edit && git push)) || true
